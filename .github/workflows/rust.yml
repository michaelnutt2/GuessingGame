name: Rust Compile Check

on:
    push:
        branches: [ "trunk" ]
    pull_request:
        branches: [ "trunk" ]

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3

        - name: Check if code compiles
          run: cargo check --verbose